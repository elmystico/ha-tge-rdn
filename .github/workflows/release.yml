name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version in manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version=$v' custom_components/tge_rdn/manifest.json > m.json
          mv m.json custom_components/tge_rdn/manifest.json
      - name: Zip
        run: cd custom_components/tge_rdn && zip -r ../../tge_rdn.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: tge_rdn.zip
