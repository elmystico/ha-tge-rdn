name: Release

# Push do main ze zmienioną wersją w manifest.json → automatycznie tag vX.Y.Z
# i wydanie (opis = lista zmian od poprzedniego tagu, paczka zip dla HACS).
# Ręcznie opublikowane wydanie też dostaje paczkę zip.
on:
  push:
    branches: [main]
    paths:
      - 'custom_components/tge_rdn/manifest.json'
      - '.github/workflows/release.yml'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        id: v
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            jq --arg v "$VERSION" '.version=$v' custom_components/tge_rdn/manifest.json > m.json
            mv m.json custom_components/tge_rdn/manifest.json
          else
            VERSION=$(jq -r .version custom_components/tge_rdn/manifest.json)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Release notes
        if: github.event_name == 'push' && steps.v.outputs.skip != 'true'
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          git log --no-merges --format='- %s' ${PREV:+$PREV..}HEAD -- custom_components tests > notes.md
      - name: Zip
        if: steps.v.outputs.skip != 'true'
        run: cd custom_components/tge_rdn && zip -r ../../tge_rdn.zip .
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.skip != 'true'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.v.outputs.version }}
          body_path: ${{ github.event_name == 'push' && 'notes.md' || '' }}
          files: tge_rdn.zip
